name: Backend CD

on:
  push:
    branches: [develop, feat/root_infra]
    paths:
      - ".github/workflows/backend-cd.yml"
      - "back/src/**"
      - "back/build.gradle"
      - "back/settings.gradle"
      - "back/Dockerfile"

env:
  IMAGE_NAME: nbe10-12-final-baedang
  CONTAINER_1_NAME: back_1
  CONTAINER_2_NAME: back_2
  APPLICATION_PORT: 8080
  DOCKERFILE_DIR: back
  INSTANCE_TAG_NAME: baedang-ec2-1
  DOCKER_NETWORK: common

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  createTagAndRelease:
    name: 1. 태그 및 릴리즈 생성
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create_tag.outputs.new_tag }}

    steps:
      - uses: actions/checkout@v6

      - name: 태그 생성 (ex. v1.2.3)
        id: create_tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리즈 생성
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create_tag.outputs.new_tag }}
          release_name: Release ${{ steps.create_tag.outputs.new_tag }}
          body: ${{ steps.create_tag.outputs.changelog }}
          draft: false
          prerelease: false

  buildAndPushDockerImage:
    name: 2. 도커 이미지 빌드 및 푸시
    needs: [createTagAndRelease]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Docker Buildx 설치
        uses: docker/setup-buildx-action@v4

      - name: 레지스트리 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 저장소 소유자명을 소문자로 (GHCR 경로 표준화)
        env:
          OWNER: "${{ github.repository_owner }}"
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_ENV}"

      - name: "이미지 빌드 및 푸시"
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKERFILE_DIR }}
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ needs.createTagAndRelease.outputs.tag}}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: 3.  배포
    runs-on: ubuntu-latest
    needs: [createTagAndRelease, buildAndPushDockerImage]

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get Instance ID
        id: get_instance_id
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=baedang-ec2-1" "Name=instance-state-name,Values=running" --query "Reservations[].Instances[].InstanceId" --output text)
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ env.INSTANCE_ID }}
        run: |
          OWNER_LC="${{ github.repository_owner }}"
          OWNER_LC="${OWNER_LC,,}"
          IMAGE_TAG="${{ needs.createTagAndRelease.outputs.tag }}"
          IMAGE_NAME="${{ env.IMAGE_NAME }}"
          IMAGE="ghcr.io/${OWNER_LC}/${IMAGE_NAME}:${IMAGE_TAG}"

          SCRIPT=$(cat <<DEPLOY
          docker pull $IMAGE

          docker stop back_1 || true
          docker rm back_1 || true

          docker run -d \
            --name back_1 \
            --network common \
            --restart unless-stopped \
            --env-file /.env \
            -p 8080:8080 \
            $IMAGE

          docker image prune -af
          DEPLOY
          )
          PARAMS=$(jq -n --arg cmd "$SCRIPT" '{"commands":[$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID")

          STATUS=$(echo "$OUTPUT" | jq -r '.Status')
          echo "Status: $STATUS"
          echo "--- stdout ---"
          echo "$OUTPUT" | jq -r '.StandardOutputContent'
          echo "--- stderr ---"
          echo "$OUTPUT" | jq -r '.StandardErrorContent'

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi

