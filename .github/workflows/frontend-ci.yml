name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'front/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-build:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: front/node_modules
          key: ${{ runner.os }}-node-20-modules-${{ hashFiles('front/package-lock.json') }}

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: front/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('front/package-lock.json') }}-${{ hashFiles('front/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('front/package-lock.json') }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: front

      - name: Run ESLint
        run: npm run lint
        working-directory: front

      - name: Run Tests
        run: npm run test
        working-directory: front

      - name: Run Next.js Build & Type Check
        run: npm run build
        working-directory: front
