name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Automated Code Review by Gemini
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          node - << 'EOF'
          const https = require('https');
          const fs = require('fs');
          const { execSync } = require('child_process');

          const apiKey = process.env.GEMINI_API_KEY;
          const prNumber = process.env.PR_NUMBER;
          const prTitle = process.env.PR_TITLE;
          const baseSha = process.env.BASE_SHA;
          const headSha = process.env.HEAD_SHA;
          const repo = process.env.REPO;
          const TAG = '<!-- GEMINI_AI_REVIEW -->';
          const QUOTA_NOTICE = '\n\n> ※ 안내: 최신 커밋에 대한 Gemini 코드 리뷰 갱신이 API 할당량(Quota) 초과로 건너뛰어졌습니다. 위 내용은 이전 커밋 기준 리뷰입니다.';

          if (!apiKey) {
            console.log("GEMINI_API_KEY is not configured in Repository Secrets. Skipping Gemini code review.");
            process.exit(0);
          }

          let diff = '';
          try {
            diff = execSync(`git diff ${baseSha}...${headSha}`).toString();
          } catch (e) {
            console.error("Failed to get git diff:", e.message);
            diff = execSync(`git diff HEAD~1`).toString();
          }

          if (!diff.trim()) {
            console.log("No diff found. Skipping review.");
            process.exit(0);
          }

          // Truncate diff if it exceeds approx 30,000 characters
          const MAX_DIFF_LEN = 30000;
          let truncated = false;
          if (diff.length > MAX_DIFF_LEN) {
            diff = diff.substring(0, MAX_DIFF_LEN);
            truncated = true;
          }

          // Load review guidelines from dedicated markdown file
          let guidelines = '';
          const rulesPath = '.github/gemini-rules.md';
          if (fs.existsSync(rulesPath)) {
            guidelines = fs.readFileSync(rulesPath, 'utf8');
          } else {
            guidelines = "당신은 모의 주식 트레이딩 서비스의 시니어 코드 리뷰어 AI입니다. 코드 품질, 동시성, 금융 반올림 규칙, 예외 처리를 꼼꼼히 검토해 주세요. 이모지는 사용하지 마세요.";
          }

          // Helper to find existing comment
          function getExistingComment() {
            try {
              const commentsJson = execSync(`gh api repos/${repo}/issues/${prNumber}/comments --paginate`, {
                env: { ...process.env, GITHUB_TOKEN: process.env.GITHUB_TOKEN }
              }).toString();
              const comments = JSON.parse(commentsJson);
              return comments.find(c => c.body && c.body.includes(TAG)) || null;
            } catch (err) {
              console.error("Failed to query existing PR comments:", err.message);
              return null;
            }
          }

          // Handle quota exhaustion gracefully by appending a notice to existing review
          function handleQuotaExceededNotice(reason) {
            console.warn(`[WARN] ${reason}. Appending quota notice to existing review.`);
            const existing = getExistingComment();
            if (existing) {
              if (!existing.body.includes('할당량(Quota) 초과로 건너뛰어졌습니다')) {
                const updatedBody = existing.body + QUOTA_NOTICE;
                const payloadPath = '/tmp/quota_payload.json';
                fs.writeFileSync(payloadPath, JSON.stringify({ body: updatedBody }));
                try {
                  execSync(`gh api -X PATCH repos/${repo}/issues/comments/${existing.id} --input ${payloadPath}`, {
                    env: { ...process.env, GITHUB_TOKEN: process.env.GITHUB_TOKEN }
                  });
                  console.log(`Successfully appended quota notice to existing comment (ID: ${existing.id})`);
                } catch (e) {
                  console.error("Failed to update comment with quota notice:", e.message);
                }
              }
            }
            process.exit(0);
          }

          const prompt = `${guidelines}

[Pull Request 정보]
- PR 번호: #${prNumber}
- PR 제목: ${prTitle}
${truncated ? '- (주의: diff가 너무 커서 앞부분 일부만 포함되었습니다.)' : ''}

[코드 변경사항 (Diff)]
\`\`\`diff
${diff}
\`\`\`
`;

          const requestData = JSON.stringify({
            contents: [
              {
                parts: [{ text: prompt }]
              }
            ],
            generationConfig: {
              temperature: 0.2,
              maxOutputTokens: 2048
            }
          });

          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

          const req = https.request(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(requestData)
            }
          }, (res) => {
            let body = '';
            res.on('data', (chunk) => body += chunk);
            res.on('end', () => {
              if (res.statusCode >= 400) {
                handleQuotaExceededNotice(`Gemini API returned status ${res.statusCode}`);
                return;
              }

              try {
                const json = JSON.parse(body);
                const reviewText = json.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!reviewText || !reviewText.trim()) {
                  handleQuotaExceededNotice("Empty review content returned from Gemini");
                  return;
                }

                const commentBody = `${TAG}\n### [Gemini AI 코드 리뷰 - PR #${prNumber}]\n\n${reviewText}\n\n---\n*이 리뷰는 GitHub Actions와 Gemini 2.0 Flash에 의해 자동으로 생성·갱신되었습니다.*`;

                const existing = getExistingComment();
                const payloadPath = '/tmp/review_payload.json';
                fs.writeFileSync(payloadPath, JSON.stringify({ body: commentBody }));

                if (existing) {
                  // Update existing comment (Overwrite cleanly with new review)
                  execSync(`gh api -X PATCH repos/${repo}/issues/comments/${existing.id} --input ${payloadPath}`, {
                    env: { ...process.env, GITHUB_TOKEN: process.env.GITHUB_TOKEN }
                  });
                  console.log(`Successfully updated existing Gemini code review comment (ID: ${existing.id}) on PR #${prNumber}`);
                } else {
                  // Create new comment
                  execSync(`gh api -X POST repos/${repo}/issues/${prNumber}/comments --input ${payloadPath}`, {
                    env: { ...process.env, GITHUB_TOKEN: process.env.GITHUB_TOKEN }
                  });
                  console.log(`Successfully posted new Gemini code review comment on PR #${prNumber}`);
                }
              } catch (e) {
                console.error("Failed to parse Gemini response or post PR comment:", e.message);
              }
            });
          });

          req.on('error', (e) => {
            handleQuotaExceededNotice(`Gemini API request network error: ${e.message}`);
          });

          req.write(requestData);
          req.end();
          EOF
