plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.baedang'
version = '0.0.1'
description = 'back'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Swagger / OpenAPI 문서 (springdoc). Swagger UI + /v3/api-docs 자동 생성.
    //   Spring Boot 3.5 은 springdoc 2.8.x 계열과 호환된다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    // Spring Boot Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Prometheus
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ── 외부 API(Toss) 어댑터 테스트용 — 실제 Toss 를 호출하지 않고 응답을 스텁한다.
    //    org.wiremock:wiremock 은 Jetty 서버 구현체를 포함하지 않는 모듈형 아티팩트라
    //    별도로 추가해야 한다 — standalone 버전이 다 번들돼 있어 더 간단하다.
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
    // 테스트가 끝나면 커버리지 리포트를 이어서 생성한다.
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.12'
}

// 커버리지 리포트(HTML: 사람이 열람 / XML: CI·뱃지 연동용). 초기엔 report-only —
// 커버리지 강제(jacocoTestCoverageVerification threshold)는 후속 이슈에서 팀 합의 후 추가.
tasks.named('jacocoTestReport') {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
}

tasks.named('jar') {
    enabled = false
}

tasks.named('bootJar') {
    enabled = true
    archiveFileName = 'application.jar'
}
