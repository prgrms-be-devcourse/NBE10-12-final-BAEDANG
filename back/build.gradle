plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.baedang'
version = '0.0.1'
description = 'back'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springframework.security:spring-security-crypto' // ── 비밀번호 해시

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ── 외부 API(Toss) 어댑터 테스트용 — 실제 Toss 를 호출하지 않고 응답을 스텁한다.
    //    org.wiremock:wiremock 은 Jetty 서버 구현체를 포함하지 않는 모듈형 아티팩트라
    //    별도로 추가해야 한다 — standalone 버전이 다 번들돼 있어 더 간단하다.
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    enabled = false
}

tasks.named('bootJar') {
    enabled = true
    archiveFileName = 'application.jar'
}
