# 기존 볼륨을 유지한 채 가상 호가 스키마를 올리는 경우(애플리케이션 중지 후):
#   psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../migrations/2026-09-07-orderbook.sql
# 이 migration은 기존 trade_execution.book_level_id 고아 참조와 중복 active 버전을
# 먼저 검사하고, 문제가 있으면 전체 트랜잭션을 중단합니다. 기존 체결·원장 행은 수정하지 않습니다.

# 모의 주식 트레이딩 서비스 — 로컬 개발 환경
#
#   docker compose up -d        기동
#   docker compose logs -f      로그 확인
#   docker compose down         중지 (데이터 유지)
#   docker compose down -v      중지 + 데이터 삭제  ← 스키마 바뀌면 이걸로 재생성
#
# [스키마 관리 — Flyway]
#   이 컨테이너는 빈 DB 로 뜹니다. 스키마는 백엔드 기동 시 Flyway 가 만듭니다.
#       back/src/main/resources/db/migration/
#   스키마를 바꿀 때는 V2, V3 ... 새 마이그레이션 파일을 추가하세요.
#   적용된 마이그레이션은 절대 수정하지 않습니다 (체크섬 불일치로 기동 실패).
#
# 접속 정보
#   host      localhost:5432
#   database  trading
#   user      trading / trading
#
# JDBC URL:  jdbc:postgresql://localhost:5432/trading

services:
  postgres:
    # ── TimescaleDB 를 쓸 경우 (daily_candle 하이퍼테이블 + 주봉 연속 집계) ──
    #   timescale/timescaledb 이미지에는 PostgreSQL 이 함께 들어 있습니다.
    #   태그의 pg17 은 내장된 PostgreSQL 버전이며, TimescaleDB 가 지원하는
    #   최신 PG 버전을 쓰세요 (PG18 태그가 나왔는지 Docker Hub 에서 확인).
    image: timescale/timescaledb:latest-pg18
    #
    # ── TimescaleDB 없이 순수 PostgreSQL 로 갈 경우 ──
    #   V1__init.sql 의 TimescaleDB 절에서 실패하므로 그 절을 뺀 마이그레이션이
    #   따로 필요합니다. daily_candle 이 일반 테이블로 남을 뿐 나머지는 그대로입니다.
    # image: postgres:18-alpine
    container_name: trading-db
    # pg_stat_statements 로 부하 테스트 중 상위 쿼리·DB time 을 수집한다(이슈 #70).
    #   shared_preload_libraries 는 재시작이 필요하고, -c 로 넘기면 conf 값을 통째로
    #   덮으므로 timescaledb 를 반드시 함께 명시한다(빠지면 하이퍼테이블이 깨진다).
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb,pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      TZ: Asia/Seoul
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      # 데이터 영속화 (컨테이너를 지워도 테이블이 남음)
      - pgdata:/var/lib/postgresql

      # 테스트용 시드 데이터가 필요하면 주석을 푸세요.
      # - ./db/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 선택 — DB 를 GUI 로 보고 싶을 때. 필요 없으면 지우세요.
  # 접속: http://localhost:8082  (user@example.com / admin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trading-pgadmin
    ports:
      - "8082:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"] # docker compose --profile tools up -d 로만 기동

volumes:
  pgdata:
