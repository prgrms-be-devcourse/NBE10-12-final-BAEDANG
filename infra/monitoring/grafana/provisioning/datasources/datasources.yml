# ============================================================================
#  Grafana 데이터소스 프로비저닝
#
#  [!! uid 를 PROM 으로 고정한다]
#    uid 를 비워두면 Grafana 가 임의 문자열을 만든다. 그러면 프로비저닝한 대시보드
#    JSON 이 참조하는 uid("PROM")와 어긋나 패널이 전부 "Datasource not found" 가 된다.
#    대시보드 JSON 의 datasource.uid 도 전부 PROM 으로 맞춰야 한다.
# ============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    uid: PROM
    type: prometheus
    access: proxy
    # 같은 compose 네트워크 안이라 컨테이너명으로 접근한다.
    url: http://monitoring-prometheus:9090
    isDefault: true
    editable: false
