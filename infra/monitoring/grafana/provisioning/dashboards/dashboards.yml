# ============================================================================
#  Grafana 대시보드 프로비저닝
#    grafana/dashboards/*.json 을 자동 등록한다. path 는 compose 볼륨 마운트
#    타깃(/var/lib/grafana/dashboards)과 일치해야 한다.
# ============================================================================
apiVersion: 1

providers:
  - name: monitoring
    orgId: 1
    folder: "Service Monitoring"
    type: file
    disableDeletion: false
    # UI 에서 임시로 패널을 만지며 조정할 수 있게 허용. 확정본은 JSON 에 반영한다.
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
