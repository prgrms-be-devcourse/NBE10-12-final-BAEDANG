# ============================================================================
#  상시 운영 모니터링 스택 (Prometheus + Grafana + postgres-exporter)
#
#  [무엇을 위한 스택인가]
#    "평소에 서버가 문제없이 돌고 있나"를 보는 용도. 부하 테스트 전용인
#    infra/development / infra/load-test 스택과는 목적이 다르다.
#
#  [!! 이 스택과 infra/development 스택을 동시에 띄우지 말 것]
#    두 스택 모두 Grafana 를 호스트 3001 포트로 노출한다. 하나만 띄운다.
#
#  [앱과 DB 는 이 파일에 없다]
#    앱은 IntelliJ 에서 호스트로 직접 실행하고(관리 포트 8081), DB 는 별도
#    compose(infra/local · infra/development)로 뜬다. 이 스택은 그 둘을
#    host.docker.internal 로 "바깥에서 관측"만 한다.
# ============================================================================
services:
  prometheus:
    # !! latest 금지 — 팀원마다 받는 시점이 갈려 재현이 안 된다. 버전을 고정한다.
    image: prom/prometheus:v3.1.0
    container_name: monitoring-prometheus
    ports:
      # 규칙 리로드(curl -X POST .../-/reload)와 targets 확인을 호스트에서 하려고 연다.
      - "9090:9090"
    volumes:
      - promdata:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 알림 규칙 디렉터리. rule_files 글롭(/etc/prometheus/rules/*.yml)과 반드시 일치.
      - ./rules:/etc/prometheus/rules:ro
    # !! command 를 지정하면 이미지 기본 인자가 통째로 대체된다. config.file/storage 를
    #    반드시 다시 명시한다. 상시 운영이라 보존을 시간·크기 둘 다로 제한하고
    #    (30일 · 5GB, 먼저 닿는 쪽이 이긴다), --web.enable-lifecycle 로 규칙 무중단 리로드를 연다.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=5GB"
      - "--web.enable-lifecycle"
    # !! 호스트에서 직접 띄운 앱(host.docker.internal:8081)을 scrape 하려면 필요.
    #    Docker Desktop 은 자동 제공하지만 Linux 호스트에선 이 매핑이 있어야 한다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    # !! latest 금지 — 버전 고정.
    image: grafana/grafana:11.4.0
    container_name: monitoring-grafana
    ports:
      # !! 3001 을 쓴다. 기본 3000 은 Next.js 개발 서버와 겹친다.
      - "3001:3000"
    depends_on:
      - prometheus
    environment:
      # 로컬 관측용이라 기본 계정. 운영 배포 시엔 반드시 바꾼다.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      # 데이터소스·대시보드 provider 정의를 코드로 프로비저닝한다.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # authored 대시보드 JSON. provider(dashboards.yml)의 path 와 일치해야 한다.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - monitoring

  postgres-exporter:
    # !! latest 금지 — 버전 고정.
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: monitoring-postgres-exporter
    environment:
      # !! 호스트의 PostgreSQL(별도 compose)을 본다. host.docker.internal 로 나간다.
      #    비밀번호는 로컬 개발 DB 기본값이라 새 비밀을 하드코딩하지 않고 환경변수로 받되
      #    기본값을 준다. sslmode=disable — 로컬 DB 는 TLS 를 안 쓴다.
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME:-trading}:${DB_PASSWORD:-trading}@host.docker.internal:5432/${DB_NAME:-trading}?sslmode=disable"
    # !! exporter 도 host.docker.internal 로 DB 에 닿아야 하므로 매핑이 필요하다(빠뜨리기 쉽다).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  promdata:

networks:
  monitoring:
    name: monitoring
    driver: bridge
